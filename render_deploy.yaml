# Render Deployment Configuration
# This file contains all the configuration needed for deploying to Render

# Service Configuration
service:
  name: judicial-supreme-backend
  type: web
  env: docker
  region: oregon  # or closest to your users
  plan: free  # upgrade to standard for production

# Build Configuration
build:
  dockerfilePath: ./Dockerfile
  dockerContext: .

# Runtime Configuration
runtime:
  startCommand: gunicorn -k eventlet -w 1 run:app
  healthCheckPath: /health
  healthCheckTimeout: 30
  healthCheckInterval: 10
  healthCheckGracePeriod: 60

# Environment Variables (Required)
environment:
  # Core Configuration
  FLASK_ENV: production
  GUNICORN_WORKERS: 1
  
  # Database (will be set by Render PostgreSQL service)
  DATABASE_URL: ""  # Set from Render PostgreSQL service
  
  # Security (generate these values)
  JWT_SECRET_KEY: ""  # Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"
  SECRET_KEY: ""       # Generate: python -c "import secrets; print(secrets.token_hex(32))"
  
  # Performance & Logging
  LOG_LEVEL: INFO
  AI_TIMEOUT_SECONDS: 30
  AI_MAX_TOKENS: 4000
  
  # Optional: AI Services
  OPENAI_API_KEY: ""  # Add if using AI features

# Render PostgreSQL Service Configuration
database:
  name: judicial-supreme-db
  type: postgres
  plan: free  # upgrade to standard for production
  databaseName: judicial_supreme
  user: judicial_user
