version: '3.9'

services:
  # PostgreSQL Database Service (matches Render managed PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: judicial_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      POSTGRES_DB: ${POSTGRES_DB:-judicial_supreme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - judicial_network

  # Flask Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judicial_backend
    environment:
      # Flask configuration
      FLASK_ENV: production
      FLASK_APP: run:app
      
      # Database configuration (PostgreSQL for production parity)
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@postgres:5432/${POSTGRES_DB:-judicial_supreme}
      
      # JWT configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-random-32-character-key-in-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-random-secret-key}
      
      # Gunicorn configuration (1 worker for Render Free tier)
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      
      # OpenAI (if enabled)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Other configurations
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    
    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    restart: unless-stopped
    networks:
      - judicial_network

volumes:
  postgres_data:
    driver: local

networks:
  judicial_network:
    driver: bridge
