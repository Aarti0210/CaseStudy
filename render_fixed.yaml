# ==========================================================
# Judicial Supreme Backend - Render Deployment Configuration
# ==========================================================

services:
  # ==========================================================
  # Web Service
  # ==========================================================
  - type: web
    name: judicial-supreme-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 run:app
    healthCheckPath: /health
    healthCheckTimeoutSeconds: 30
    autoDeploy: true
    envVars:
      # Flask Configuration
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run:app
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      
      # Security Keys (REPLACE WITH YOUR VALUES)
      - key: SECRET_KEY
        value: Ab234h12iihjik39jkl21lala90sjdke
      - key: JWT_SECRET_KEY
        value: hjk234hsiut8wok213dnxufia9w0ekwn
      
      # Database Configuration (Neon)
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_7SIXqtaY8RCk@ep-summer-cell-a8v81ozr-pooler.eastus2.azure.neon.tech/neondb?sslmode=require&channel_binding=require
      
      # Rate Limiting (Upstash Redis)
      - key: RATELIMIT_STORAGE_URI
        value: rediss://default:gQAAAAAAATGDAAIncDJhOTg4NmZlODE5NTM0MTI0OTI5ZGQyZjczOWM4MTAwOHAyNzgyMTE@glorious-longhorn-78211.upstash.io:6379
      - key: RATELIMIT_DEFAULT
        value: 200 per day;50 per hour
      
      # Email Configuration (REPLACE WITH YOUR VALUES)
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        value: your-email@gmail.com
      - key: MAIL_PASSWORD
        value: your-app-password
      - key: MAIL_DEFAULT_SENDER
        value: no-reply@judicial.local
      
      # JWT Configuration
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "3600"
      - key: JWT_REFRESH_TOKEN_EXPIRES
        value: "86400"
      
      # OTP Configuration
      - key: OTP_TTL
        value: "300"
      - key: OTP_RESEND_COOLDOWN
        value: "60"
      - key: OTP_SEND_MAX_RETRIES
        value: "3"
      
      # OpenAI Configuration (REPLACE WITH YOUR KEY)
      - key: OPENAI_API_KEY
        value: sk-9b464c9b4ba74286813b134746dc640d
      - key: AI_MODEL
        value: gpt-4-turbo
      - key: AI_CACHE_TTL
        value: "300"
      
      # File Upload Configuration
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      
      # ML Configuration
      - key: LOW_DELAY_THRESHOLD
        value: "365"
      - key: HIGH_DELAY_THRESHOLD
        value: "900"

