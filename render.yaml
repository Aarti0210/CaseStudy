# ==========================================================
# Judicial Supreme Backend - SECURE Production Deployment
# ==========================================================

services:
  # ==========================================================
  # Web Service
  # ==========================================================
  - type: web
    name: judicial-supreme-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --worker-class gthread --threads 4 --timeout 120
    healthCheckPath: /health
    healthCheckTimeoutSeconds: 100
    autoDeploy: true
    
    # Environment Variables (SECURE VALUES)
    envVars:
      # Flask Configuration
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app:app
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      
      # Security Keys (NEWLY GENERATED - SECURE)
      - key: SECRET_KEY
        value: -6AQ05tPDc9jiyRDjfhTaZPo08kePXLTzeAjDqL95ss
      - key: JWT_SECRET_KEY
        value: h6wfrqZnTjMIIcu3hGDYtndADjeusbolsxJry_iR3kQ
      
      # Database Configuration (NEON)
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_7SIXqtaY8RCk@ep-summer-cell-a8v81ozr-pooler.eastus2.azure.neon.tech/neondb?sslmode=require&channel_binding=require
      
      # OpenAI Configuration (NEW API KEY)
      - key: OPENAI_API_KEY
        value: sk-EWuGUKj8aiY0RHlqfIP7Wy3Q937RN8xCc3J7tN9j01E
      - key: AI_MODEL
        value: gpt-4-turbo
      - key: AI_CACHE_TTL
        value: "300"
      
      # Rate Limiting (REDIS - Upstash)
      - key: RATELIMIT_STORAGE_URI
        value: rediss://default:gQAAAAAAATGDAAIncDJhOTg4NmZlODE5NTM0MTI0OTI5ZGQyZjczOWM4MTAwOHAyNzgyMTE@glorious-longhorn-78211.upstash.io:6379
      - key: RATELIMIT_DEFAULT
        value: 200 per day;50 per hour
      
      # Redis SSL Configuration
      - key: REDIS_SSL
        value: "true"
      - key: REDIS_TLS_CERT_REQS
        value: required
      
      # Email Configuration (UPDATE WITH YOUR VALUES)
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        sync: false
        generateName: MAIL_USERNAME
      - key: MAIL_PASSWORD
        sync: false
        generateName: MAIL_PASSWORD
      - key: MAIL_DEFAULT_SENDER
        value: no-reply@judicial.local
      
      # JWT Configuration
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "3600"
      - key: JWT_REFRESH_TOKEN_EXPIRES
        value: "86400"
      
      # OTP Configuration
      - key: OTP_TTL
        value: "300"
      - key: OTP_RESEND_COOLDOWN
        value: "60"
      - key: OTP_SEND_MAX_RETRIES
        value: "3"
      
      # File Upload Configuration
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      
      # ML Configuration
      - key: LOW_DELAY_THRESHOLD
        value: "365"
      - key: HIGH_DELAY_THRESHOLD
        value: "900"
      
      # Production Settings
      - key: PORT
        value: "5000"
      - key: SECURE_HEADERS
        value: "true"
      - key: ENABLE_METRICS
        value: "true"
      - key: STRICT_RATE_LIMITING
        value: "true"

