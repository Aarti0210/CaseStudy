# ==========================================================
# Judicial Supreme Backend - Production Deployment Configuration
# ==========================================================

services:
  # ==========================================================
  # Web Service
  # ==========================================================
  - type: web
    name: judicial-supreme-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 run:app
    healthCheckPath: /health
    healthCheckTimeoutSeconds: 30
    autoDeploy: true
    
    # Environment Variables
    envVars:
      # Flask Configuration
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run:app
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      
      # Security Keys (REPLACE WITH YOUR SECURE VALUES)
      - key: SECRET_KEY
        sync: false
        generateName: SECRET_KEY
      - key: JWT_SECRET_KEY
        sync: false
        generateName: JWT_SECRET_KEY
      
      # Database Configuration (Neon)
      - key: DATABASE_URL
        sync: false
        generateName: DATABASE_URL
      
      # Rate Limiting (Upstash Redis)
      - key: RATELIMIT_STORAGE_URI
        sync: false
        generateName: RATELIMIT_STORAGE_URI
      - key: RATELIMIT_DEFAULT
        value: 200 per day;50 per hour
      
      # Email Configuration (REPLACE WITH YOUR VALUES)
      - key: MAIL_SERVER
        sync: false
        generateName: MAIL_SERVER
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
        generateName: MAIL_USERNAME
      - key: MAIL_PASSWORD
        sync: false
        generateName: MAIL_PASSWORD
      - key: MAIL_DEFAULT_SENDER
        value: no-reply@judicial.local
      
      # JWT Configuration
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "3600"
      - key: JWT_REFRESH_TOKEN_EXPIRES
        value: "86400"
      
      # OTP Configuration
      - key: OTP_TTL
        value: "300"
      - key: OTP_RESEND_COOLDOWN
        value: "60"
      - key: OTP_SEND_MAX_RETRIES
        value: "3"
      
      # OpenAI Configuration (REPLACE WITH YOUR KEY)
      - key: OPENAI_API_KEY
        sync: false
        generateName: OPENAI_API_KEY
      - key: AI_MODEL
        value: gpt-4-turbo
      - key: AI_CACHE_TTL
        value: "300"
      
      # File Upload Configuration
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      
      # ML Configuration
      - key: LOW_DELAY_THRESHOLD
        value: "365"
      - key: HIGH_DELAY_THRESHOLD
        value: "900"
      
      # Security Configuration
      - key: SECURE_HEADERS
        value: "true"
      - key: ENABLE_METRICS
        value: "true"
      - key: STRICT_RATE_LIMITING
        value: "true"

